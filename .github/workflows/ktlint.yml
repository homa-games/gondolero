name: ktlint Check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ktlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Run ktlint
        run: ./gradlew ktlintCheck --continue

      - name: Upload ktlint details on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: app/build/reports/ktlint
          retention-days: 1
